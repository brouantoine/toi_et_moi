# Local stack: postgres, redis, minio, backend (ASGI), celery worker, celery beat.
# Usage: make up   (or: docker compose up --build)
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: dev-only-not-secret
  DATABASE_URL: postgres://nousdeux:nousdeux@postgres:5432/nousdeux
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: nousdeux

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nousdeux
      POSTGRES_USER: nousdeux
      POSTGRES_PASSWORD: nousdeux
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nousdeux"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/nousdeux"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput
      && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    environment: *backend-env
    depends_on: [backend]

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: *backend-env
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
