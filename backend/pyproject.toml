[project]
name = "nousdeux-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "DJ008", "RUF001"]
# User-facing French texts: typographic apostrophes and non-breaking spaces are intended.
"**/messages.py" = ["RUF001"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['\.venv/', 'migrations/']

[[tool.mypy.overrides]]
module = ["dj_database_url.*", "storages.*", "channels.*", "corsheaders.*", "boto3.*", "botocore.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy ships partial types that fight with Django models: treat as Any.
module = ["factory", "factory.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "manage.py"]
