<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block robots %}<meta name="robots" content="noindex">{% endblock %}
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <style>
    :root { --bg:#FFFBFF; --surface:#FFFBFF; --text:#211A29; --muted:#625A6B; --primary:#681BE8; --on-primary:#FFFBFF; --soft:#F2E8FF; --border:#EADFF2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14101A; --surface:#201B24; --text:#FFFBFF; --muted:#B7AEC0; --primary:#B98CFF; --on-primary:#1A0B33; --soft:#2E1F4A; --border:#3A3242; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:24px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 16px; }
    h2 { font-size: 21px; margin: 28px 0 8px; }
    p, li { color: var(--text); }
    .muted { color: var(--muted); }
    a { color: var(--primary); }
    label { display:block; font-weight:600; margin: 16px 0 6px; }
    input { width:100%; min-height:48px; padding:10px 14px; border:1px solid var(--border); border-radius:14px; background:var(--bg); color:var(--text); font-size:17px; }
    button { margin-top: 20px; min-height:48px; padding: 0 24px; border:0; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:16px; font-weight:600; cursor:pointer; }
    .errorlist { color:#A23B2C; padding-left: 18px; }
    footer { margin-top: 32px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
    <footer class="muted">{{ brand }}</footer>
  </main>
</body>
</html>
