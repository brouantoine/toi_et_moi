{% load static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="icon" type="image/png" href="{% static 'web/favicon.png' %}">
  <style>
    :root { --bg:#FFFFFF; --wash:#FFF4F5; --surface:#FFFFFF; --text:#1C1C1E; --muted:#5F5F64; --primary:#D0112B; --soft:#FFE1E6; --border:#F1D5D9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000000; --wash:#14070A; --surface:#1C1C1E; --text:#FFFFFF; --muted:#AEAEB4; --primary:#FF3B4E; --soft:#4A1A1C; --border:#38383A; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:linear-gradient(180deg, var(--wash) 0, var(--bg) 520px); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height:100vh; }
    main { max-width: 880px; margin: 0 auto; padding: 56px 16px 48px; }
    .hero { text-align:center; margin-bottom: 48px; }
    .hero img { width:120px; height:auto; }
    h1 { font-size: 44px; line-height:1.1; margin: 16px 0 8px; letter-spacing:-0.02em; }
    .tagline { font-size: 22px; color: var(--muted); margin: 0 0 20px; }
    .soon { display:inline-block; margin:0; padding: 8px 18px; border-radius:999px; background:var(--soft); color:var(--primary); font-weight:600; font-size:15px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; }
    .card h2 { font-size:19px; margin:0 0 6px; color:var(--primary); }
    .card p { margin:0; color:var(--muted); }
    .links { display:flex; flex-wrap:wrap; justify-content:center; gap: 8px 22px; margin-top: 48px; font-size:15px; }
    a { color: var(--primary); text-decoration:none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 20px; text-align:center; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
    <footer>© {% now "Y" %} {{ brand }}</footer>
  </main>
</body>
</html>
