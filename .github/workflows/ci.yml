name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nousdeux
          POSTGRES_USER: nousdeux
          POSTGRES_PASSWORD: nousdeux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nousdeux" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nousdeux:nousdeux@localhost:5432/nousdeux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pytest --cov --cov-report=term
      - name: Deploy checks with production settings
        env:
          DJANGO_SECRET_KEY: ci-dummy-secret-key-with-enough-length-and-entropy-0123456789-abc
          DJANGO_ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --settings=config.settings.prod

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      - run: npx expo-doctor

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements/dev.txt
      - run: cd mobile && npm ci
      - run: sh scripts/api-types.sh
      - name: Generated API types must be committed and up to date
        run: git diff --exit-code mobile/src/api/
