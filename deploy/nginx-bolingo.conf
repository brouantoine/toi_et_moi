# Nginx d'un serveur partagé (Bolingo derrière un Nginx existant). Certificats : certbot.
# Copie dans /etc/nginx/sites-available/bolingo, lien dans sites-enabled, puis
# sudo certbot --nginx -d api.bolingo.ci -d bolingo.ci -d www.bolingo.ci (+ -d media.bolingo.ci)

# Admin login: 5 attempts per minute and per IP (Django admin has no throttle of its own).
limit_req_zone $binary_remote_addr zone=bolingo_admin:1m rate=5r/m;

map $http_upgrade $bolingo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.bolingo.ci;
    server_tokens off;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/bolingo-static/;
        access_log off;
        expires 30d;
    }

    location = /admin/login/ {
        limit_req zone=bolingo_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API, temps réel (WebSocket /ws/v1/sync/), admin, pages légales.
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bolingo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Site vitrine : bolingo.ci (accueil, CGU, confidentialité, support). www redirige ici.
server {
    listen 80;
    listen [::]:80;
    server_name www.bolingo.ci;
    server_tokens off;
    return 301 https://bolingo.ci$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bolingo.ci;
    server_tokens off;

    location /static/ {
        alias /var/www/bolingo-static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Photos et notes vocales (MinIO local) : les téléphones y envoient directement.
server {
    listen 80;
    listen [::]:80;
    server_name media.bolingo.ci;
    server_tokens off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
