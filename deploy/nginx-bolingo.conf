# Nginx d'un serveur partagé (Bolingo derrière un Nginx existant). Certificats : certbot.
# Copie dans /etc/nginx/sites-available/bolingo, lien dans sites-enabled, puis
# sudo certbot --nginx -d api.bolingo.ci -d media.bolingo.ci

map $http_upgrade $bolingo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.bolingo.ci;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/bolingo-static/;
        access_log off;
        expires 30d;
    }

    # API, temps réel (WebSocket /ws/v1/sync/), admin, pages légales.
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bolingo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Photos et notes vocales (MinIO local) : les téléphones y envoient directement.
server {
    listen 80;
    listen [::]:80;
    server_name media.bolingo.ci;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
