        to the reader.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        amount:
          type: integer
          maximum: 100000000
          minimum: 1
        currency:
          type: string
          minLength: 1
          pattern: ^[A-Z]{3}$
        category:
          $ref: '#/components/schemas/ExpenseCategoryEnum'
        spent_on:
          type: string
          format: date
        paid_by:
          $ref: '#/components/schemas/PayerEnum'
        split:
          $ref: '#/components/schemas/SplitEnum'
        my_share:
          type: integer
          maximum: 100000000
          minimum: 0
    PatchedListItemRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
    PatchedMemoryRequest:
      type: object
      description: 'A shared memory. Hearts are booleans only: never a counter.'
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 5000
        happened_on:
          type: string
          format: date
        place:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/MemoryTypeEnum'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 50
    PatchedPreferenceRequest:
      type: object
      properties:
        morning_mood:
          type: boolean
        partner_mood:
          type: boolean
        memory_of_day:
          type: boolean
        daily_question:
          type: boolean
        check_in:
          type: boolean
        thinking_of_you:
          type: boolean
        pause:
          type: boolean
        organization:
          type: boolean
        messages:
