openapi: 3.0.3
info:
  title: Nous Deux API
  version: 0.1.0
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: 'Always answers 204: never reveals whether the email has an account.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/social/{provider}/:
    post:
      operationId: v1_auth_social_create
      description: 'Sign in with Apple / Google: the identity token is verified server-side.'
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: v1_auth_verify_email_resend_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/couple/:
    get:
      operationId: v1_couple_retrieve
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    post:
      operationId: v1_couple_create
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
    patch:
      operationId: v1_couple_partial_update
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    delete:
      operationId: v1_couple_destroy
      description: Cancel a pending couple nobody joined. Leaving an active couple
        is P9.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/invitation/:
    post:
      operationId: v1_couple_invitation_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/join/:
    post:
      operationId: v1_couple_join_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Liveness probe used by Docker, load balancers and the mobile app.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The authenticated user's own profile. Nobody else's profile is
        reachable here.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_me_partial_update
      description: The authenticated user's own profile. Nobody else's profile is
        reachable here.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Couple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          maxLength: 3
        photo_url:
          type: string
          nullable: true
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          readOnly: true
        invitation:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - activated_at
      - id
      - invitation
      - members
      - photo_url
      - status
    CoupleError:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    CreateCoupleRequest:
      type: object
      properties:
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          minLength: 1
          default: EUR
          maxLength: 3
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ErrorCode:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    Health:
      type: object
      properties:
        status:
          type: string
        brand:
          type: string
      required:
      - brand
      - status
    JoinCoupleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - code
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Member:
      type: object
      description: 'What a partner is allowed to see about the other: no email, no
        birth date.'
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Prénom
        nickname:
          type: string
          readOnly: true
          title: Surnom
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - avatar_url
      - display_name
      - first_name
      - id
      - nickname
      - timezone
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - token
      - uid
    PatchedCoupleRequest:
      type: object
      properties:
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          minLength: 1
          maxLength: 3
    PatchedUserRequest:
      type: object
      description: The authenticated user's own profile.
      properties:
        first_name:
          type: string
          minLength: 1
          title: Prénom
          maxLength: 60
        nickname:
          type: string
          title: Surnom
          maxLength: 60
        birth_date:
          type: string
          format: date
          nullable: true
        language:
          $ref: '#/components/schemas/LanguageEnum'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        quiet_hours_start:
          type: string
          format: time
          nullable: true
        quiet_hours_end:
          type: string
          format: time
          nullable: true
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 60
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: fr
        timezone:
          type: string
          minLength: 1
          default: UTC
          maxLength: 64
      required:
      - email
      - first_name
      - password
    SocialAuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
        created:
          type: boolean
      required:
      - access
      - created
      - refresh
      - user
    SocialLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
        nonce:
          type: string
          nullable: true
          minLength: 1
        first_name:
          type: string
          default: ''
          maxLength: 60
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: fr
      required:
      - id_token
    StatusEnum:
      enum:
      - pending
      - active
      - dissolving
      - dissolved
      type: string
      description: |-
        * `pending` - En attente du partenaire
        * `active` - Actif
        * `dissolving` - En dissolution
        * `dissolved` - Dissous
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    User:
      type: object
      description: The authenticated user's own profile.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Prénom
          maxLength: 60
        nickname:
          type: string
          title: Surnom
          maxLength: 60
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        birth_date:
          type: string
          format: date
          nullable: true
        language:
          $ref: '#/components/schemas/LanguageEnum'
        timezone:
          type: string
          maxLength: 64
        quiet_hours_start:
          type: string
          format: time
          nullable: true
        quiet_hours_end:
          type: string
          format: time
          nullable: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - display_name
      - email
      - email_verified
      - first_name
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
