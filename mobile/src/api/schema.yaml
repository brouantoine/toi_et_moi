        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Prénom
        nickname:
          type: string
          readOnly: true
          title: Surnom
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - avatar_url
      - display_name
      - first_name
      - id
      - nickname
      - timezone
    Memory:
      type: object
      description: 'A shared memory. Hearts are booleans only: never a counter.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 5000
        happened_on:
          type: string
          format: date
        place:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/MemoryTypeEnum'
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 50
        created_by:
          type: integer
          readOnly: true
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/MemoryPhoto'
          readOnly: true
        my_heart:
          type: boolean
          readOnly: true
        partner_heart:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - happened_on
      - id
      - my_heart
      - partner_heart
      - photos
      - title
      - updated_at
    MemoryComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        body:
          type: string
          maxLength: 500
        author:
          type: integer
          readOnly: true
          nullable: true
        author_name:
          type: string
          nullable: true
          readOnly: true
        mine:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_name
      - body
      - created_at
      - id
      - mine
    MemoryCommentRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - body
    MemoryPhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          nullable: true
          readOnly: true
        thumbnail_url:
          type: string
          nullable: true
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        position:
          type: integer
          readOnly: true
      required:
      - height
      - id
      - position
      - thumbnail_url
      - url
      - width
    MemoryRequest:
      type: object
      description: 'A shared memory. Hearts are booleans only: never a counter.'
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 5000
        happened_on:
          type: string
          format: date
        place:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/MemoryTypeEnum'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 50
      required:
      - happened_on
      - title
    MemoryTypeEnum:
      enum:
      - first_time
      - inside_joke
      - place
      - moment
      - quote
      type: string
      description: |-
        * `first_time` - Première fois
        * `inside_joke` - Blague à nous
        * `place` - Lieu
        * `moment` - Moment
        * `quote` - Citation
    Message:
      type: object
      description: '`author` is `me` / `you` for the reader. No read receipt, by design.'
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/MessageKindEnum'
          readOnly: true
        text:
          type: string
          readOnly: true
        author:
          type: string
          nullable: true
          readOnly: true
        media_url:
          type: string
          nullable: true
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
          nullable: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - duration_ms
      - height
      - id
      - kind
      - media_url
      - text
      - width
    MessageKindEnum:
      enum:
      - text
      - photo
      - voice
      type: string
      description: |-
        * `text` - Texte
        * `photo` - Photo
        * `voice` - Note vocale
    Mood:
      type: object
      properties:
        mood:
          $ref: '#/components/schemas/MoodEnum'
        need:
          type: string
        replies:
          type: array
          items:
            $ref: '#/components/schemas/MoodReplyEnum'
      required:
      - mood
      - need
      - replies
    MoodEnum:
      enum:
      - joyful
      - happy
      - upset
      - angry
      type: string
      description: |-
        * `joyful` - Grande joie
        * `happy` - Bonne humeur
        * `upset` - Contrariété
        * `angry` - Énervement
    MoodInputRequest:
      type: object
      properties:
        mood:
          $ref: '#/components/schemas/MoodEnum'
        need:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/NeedEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - mood
    MoodReplyEnum:
      enum:
      - here
      - courage
      - tonight
      - thinking
      type: string
      description: |-
        * `here` - Je suis là
        * `courage` - Courage
        * `tonight` - On en parle ce soir ?
        * `thinking` - Je pense à toi
    MorningToday:
      type: object
      description: Today for me and for the partner (each in their own time zone).
        Null = not shared.
      properties:
        date:
          type: string
          format: date
        mine:
          allOf:
          - $ref: '#/components/schemas/Mood'
          nullable: true
        partner:
          allOf:
          - $ref: '#/components/schemas/Mood'
          nullable: true
      required:
      - date
      - mine
      - partner
    NeedEnum:
      enum:
      - space
      - hug
      - help
      - listen
      - nothing
      type: string
      description: |-
        * `space` - Espace
        * `hug` - Câlin
        * `help` - Aide
        * `listen` - Écoute
        * `nothing` - Rien
    Occurrence:
      type: object
      description: One day on which an event happens (yearly events have one per year).
      properties:
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        event:
          $ref: '#/components/schemas/Event'
      required:
      - date
      - ends_at
      - event
      - starts_at
    OnThisDay:
      type: object
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnThisDayItem'
      required:
      - date
      - items
    OnThisDayItem:
      type: object
      properties:
        years_ago:
          type: integer
        memory:
          $ref: '#/components/schemas/Memory'
      required:
      - memory
      - years_ago
    PaginatedExpenseList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
    PaginatedMemoryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
    PaginatedMessageList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
