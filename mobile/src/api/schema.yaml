        * `ios` - iOS
        * `android` - Android
    Preference:
      type: object
      properties:
        morning_mood:
          type: boolean
        partner_mood:
          type: boolean
        memory_of_day:
          type: boolean
        daily_question:
          type: boolean
        check_in:
          type: boolean
        thinking_of_you:
          type: boolean
        pause:
          type: boolean
        organization:
          type: boolean
        messages:
          type: boolean
        morning_time:
          type: string
          format: time
        discreet:
          type: boolean
    RecurrenceEnum:
      enum:
