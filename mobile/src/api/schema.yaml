          minLength: 1
          maxLength: 3
    PatchedEventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        place:
          type: string
          maxLength: 200
        all_day:
          type: boolean
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        recurrence:
          $ref: '#/components/schemas/RecurrenceEnum'
        concerns:
