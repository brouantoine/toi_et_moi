components:
  schemas:
    AccentEnum:
      enum:
      - rouge
      - ambre
      - sauge
      - lagon
      - bleu
      - violet
      - encre
      type: string
      description: |-
        * `rouge` - Rouge
        * `ambre` - Ambre
        * `sauge` - Sauge
        * `lagon` - Lagon
        * `bleu` - Bleu
        * `violet` - Violet
        * `encre` - Encre
    Adult:
      type: object
      properties:
        mine:
          type: boolean
        partner:
          type: boolean
      required:
      - mine
      - partner
    AdultInputRequest:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    AnswerInputRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 80
        choice:
          type: integer
          maximum: 9
          minimum: 0
          nullable: true
        text:
          type: string
          maxLength: 600
        drawing:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 300
        media_key:
          type: string
