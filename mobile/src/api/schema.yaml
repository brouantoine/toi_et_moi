openapi: 3.0.3
info:
  title: Nous Deux API
  version: 0.1.0
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: 'Always answers 204: never reveals whether the email has an account.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/social/{provider}/:
    post:
      operationId: v1_auth_social_create
      description: 'Sign in with Apple / Google: the identity token is verified server-side.'
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: v1_auth_verify_email_resend_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/couple/:
    get:
      operationId: v1_couple_retrieve
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    post:
      operationId: v1_couple_create
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
    patch:
      operationId: v1_couple_partial_update
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    delete:
      operationId: v1_couple_destroy
      description: Cancel a pending couple nobody joined. Leaving an active couple
        is P9.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/invitation/:
    post:
      operationId: v1_couple_invitation_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/join/:
    post:
      operationId: v1_couple_join_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Liveness probe used by Docker, load balancers and the mobile app.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The authenticated user's own profile. Nobody else's profile is
        reachable here.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_me_partial_update
      description: The authenticated user's own profile. Nobody else's profile is
        reachable here.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/memories/:
    get:
      operationId: v1_memories_list
      description: Shared memories of the couple, newest first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Full-text search
      - in: query
        name: tag
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - first_time
          - inside_joke
          - moment
          - place
          - quote
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemoryList'
          description: ''
    post:
      operationId: v1_memories_create
      description: Shared memories of the couple, newest first.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
          description: ''
  /api/v1/memories/{memory_pk}/comments/:
    get:
      operationId: v1_memories_comments_list
      description: Short comments on a shared memory. Both partners read; only the
        author deletes.
      parameters:
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryComment'
          description: ''
    post:
      operationId: v1_memories_comments_create
      description: Short comments on a shared memory. Both partners read; only the
        author deletes.
      parameters:
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemoryCommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemoryCommentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryComment'
          description: ''
  /api/v1/memories/{memory_pk}/comments/{id}/:
    delete:
      operationId: v1_memories_comments_destroy
      description: Short comments on a shared memory. Both partners read; only the
        author deletes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory comment.
        required: true
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/memories/{memory_pk}/photos/:
    post:
      operationId: v1_memories_photos_create
      description: 'Photos of a memory: 1) ask an upload URL, 2) upload to S3, 3)
        confirm, (delete).'
      parameters:
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPhoto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/memories/{memory_pk}/photos/{id}/:
    delete:
      operationId: v1_memories_photos_destroy
      description: 'Photos of a memory: 1) ask an upload URL, 2) upload to S3, 3)
        confirm, (delete).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory photo.
        required: true
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/memories/{memory_pk}/photos/upload-url/:
    post:
      operationId: v1_memories_photos_upload_url_create
      description: 'Photos of a memory: 1) ask an upload URL, 2) upload to S3, 3)
        confirm, (delete).'
      parameters:
      - in: path
        name: memory_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/memories/{id}/:
    get:
      operationId: v1_memories_retrieve
      description: Shared memories of the couple, newest first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
          description: ''
    put:
      operationId: v1_memories_update
      description: Shared memories of the couple, newest first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
          description: ''
    patch:
      operationId: v1_memories_partial_update
      description: Shared memories of the couple, newest first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
          description: ''
    delete:
      operationId: v1_memories_destroy
      description: Shared memories of the couple, newest first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/memories/{id}/heart/:
    post:
      operationId: v1_memories_heart_create
      description: 'A single gentle heart: POST gives it, DELETE takes it back. Never
        counted.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heart'
          description: ''
    delete:
      operationId: v1_memories_heart_destroy
      description: 'A single gentle heart: POST gives it, DELETE takes it back. Never
        counted.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) memory.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heart'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Couple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          maxLength: 3
        photo_url:
          type: string
          nullable: true
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          readOnly: true
        invitation:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - activated_at
      - id
      - invitation
      - members
      - photo_url
      - status
    CoupleError:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    CreateCoupleRequest:
      type: object
      properties:
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          minLength: 1
          default: EUR
          maxLength: 3
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ErrorCode:
      type: object
      description: Business error with a stable machine code, translated by the app.
      properties:
        code:
          type: string
      required:
      - code
    Health:
      type: object
      properties:
        status:
          type: string
        brand:
          type: string
      required:
      - brand
      - status
    Heart:
      type: object
      properties:
        my_heart:
          type: boolean
      required:
      - my_heart
    JoinCoupleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - code
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Member:
      type: object
      description: 'What a partner is allowed to see about the other: no email, no
        birth date.'
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Prénom
        nickname:
          type: string
          readOnly: true
          title: Surnom
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - avatar_url
      - display_name
      - first_name
      - id
      - nickname
      - timezone
    Memory:
      type: object
      description: 'A shared memory. Hearts are booleans only: never a counter.'
      properties:
