openapi: 3.0.3
info:
  title: Bolingo API
  version: 0.1.0
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: 'Always answers 204: never reveals whether the email has an account.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/social/{provider}/:
    post:
      operationId: v1_auth_social_create
      description: 'Sign in with Apple / Google: the identity token is verified server-side.'
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: v1_auth_verify_email_resend_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/:
    post:
      operationId: v1_calls_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCallRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartCallRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartCallRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
          description: ''
  /api/v1/calls/{call_id}/accept/:
    post:
      operationId: v1_calls_accept_create
      parameters:
      - in: path
        name: call_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
          description: ''
  /api/v1/calls/{call_id}/decline/:
    post:
      operationId: v1_calls_decline_create
      parameters:
      - in: path
        name: call_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
          description: ''
  /api/v1/calls/{call_id}/end/:
    post:
      operationId: v1_calls_end_create
      parameters:
      - in: path
        name: call_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
          description: ''
  /api/v1/calls/current/:
    get:
      operationId: v1_calls_current_retrieve
      description: 'The call ringing or going on, if any: the phones check it to show
        the call screen.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCall'
          description: ''
  /api/v1/calls/ice/:
    get:
      operationId: v1_calls_ice_retrieve
      description: 'Where the phones find each other: STUN, and the TURN relay with
        fresh credentials.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceServers'
          description: ''
  /api/v1/chores/:
    get:
      operationId: v1_chores_list
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: query
        name: done
        schema:
          type: boolean
        description: Finished one-offs
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chore'
          description: ''
    post:
      operationId: v1_chores_create
      description: 'Household tasks. No score, no tally: only who carries what.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
  /api/v1/chores/{id}/:
    get:
      operationId: v1_chores_retrieve
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
    put:
      operationId: v1_chores_update
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChoreRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
    patch:
      operationId: v1_chores_partial_update
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChoreRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChoreRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChoreRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
    delete:
      operationId: v1_chores_destroy
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/chores/{id}/complete/:
    post:
      operationId: v1_chores_complete_create
      description: 'Done: a one-off is closed, a recurring chore moves to its next
        due date.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
  /api/v1/chores/{id}/reopen/:
    post:
      operationId: v1_chores_reopen_create
      description: 'Household tasks. No score, no tally: only who carries what.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) chore.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
          description: ''
  /api/v1/chores/week/:
    get:
      operationId: v1_chores_week_retrieve
      description: Open chores due this week (or without date), grouped by who carries
        them.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoreWeek'
          description: ''
  /api/v1/coach/:
    get:
      operationId: v1_coach_retrieve
      description: The couple's shared conversation with the AI coach.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachThread'
          description: ''
    delete:
      operationId: v1_coach_destroy
      description: Erases the whole conversation, for both.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/coach/consent/:
    put:
      operationId: v1_coach_consent_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachConsentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoachConsentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoachConsentInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachThread'
          description: ''
  /api/v1/coach/messages/:
    post:
      operationId: v1_coach_messages_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachPostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoachPostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoachPostRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachThread'
          description: ''
  /api/v1/couple/:
    get:
      operationId: v1_couple_retrieve
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    post:
      operationId: v1_couple_create
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
    patch:
      operationId: v1_couple_partial_update
      description: The requester's current couple (pending or active). Only ever their
        own.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoupleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '404':
          description: No response body
    delete:
      operationId: v1_couple_destroy
      description: Cancel a pending couple nobody joined. Leaving an active couple
        is P9.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/distance/:
    get:
      operationId: v1_couple_distance_retrieve
      description: How far apart you are, from your real positions, only if both of
        you agree.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
          description: ''
    put:
      operationId: v1_couple_distance_update
      description: Shares the current position (sent by the app while it is open).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
          description: ''
    delete:
      operationId: v1_couple_distance_destroy
      description: 'Stops sharing: consent withdrawn and position erased at once.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/couple/distance/consent/:
    post:
      operationId: v1_couple_distance_consent_create
      description: Accepts the location terms (the version shown in the app).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
          description: ''
  /api/v1/couple/distance/continuous/:
    put:
      operationId: v1_couple_distance_continuous_update
      description: Turns sharing while the app is closed on or off (separate, explicit
        opt-in).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuousInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContinuousInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContinuousInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
          description: ''
  /api/v1/couple/invitation/:
    post:
      operationId: v1_couple_invitation_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/join/:
    post:
      operationId: v1_couple_join_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinCoupleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Couple'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleError'
          description: ''
  /api/v1/couple/photo/:
    put:
      operationId: v1_couple_photo_update
      description: 'Shared couple photo: either partner can set or remove it.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageKeyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUrl'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
    delete:
      operationId: v1_couple_photo_destroy
      description: 'Shared couple photo: either partner can set or remove it.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/couple/photo/upload-url/:
    post:
      operationId: v1_couple_photo_upload_url_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageUploadRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadTicket'
