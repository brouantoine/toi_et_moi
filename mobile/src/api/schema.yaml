components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Balance:
      type: object
      description: Per currency. `amount` is always positive; `direction` says who
        owes whom.
      properties:
        currency:
          type: string
        amount:
          type: integer
        direction:
          $ref: '#/components/schemas/DirectionEnum'
      required:
      - amount
      - currency
      - direction
    BlankEnum:
      enum:
      - ''
    Chore:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        assignee:
          $ref: '#/components/schemas/RelativePersonEnum'
        recurrence:
          $ref: '#/components/schemas/ChoreRecurrenceEnum'
        due_date:
          type: string
          format: date
          nullable: true
        done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - done_at
      - id
      - last_done_at
      - title
    ChoreRecurrenceEnum:
      enum:
      - none
      - daily
      - weekly
      - monthly
      type: string
      description: |-
        * `none` - Une fois
        * `daily` - Chaque jour
        * `weekly` - Chaque semaine
        * `monthly` - Chaque mois
    ChoreRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        assignee:
          $ref: '#/components/schemas/RelativePersonEnum'
        recurrence:
          $ref: '#/components/schemas/ChoreRecurrenceEnum'
        due_date:
          type: string
          format: date
          nullable: true
      required:
      - title
    ChoreWeek:
      type: object
      description: 'Who carries what this week: three plain lists, never counts or
        comparisons.'
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        me:
          type: array
          items:
            $ref: '#/components/schemas/Chore'
        you:
          type: array
          items:
            $ref: '#/components/schemas/Chore'
        us:
          type: array
          items:
            $ref: '#/components/schemas/Chore'
      required:
      - end
      - me
      - start
      - us
      - you
    Couple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CoupleStatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          maxLength: 3
        photo_url:
          type: string
          nullable: true
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          readOnly: true
        invitation:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - activated_at
      - id
      - invitation
      - members
      - photo_url
      - status
    CoupleError:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    CoupleStatusEnum:
      enum:
      - pending
      - active
      - dissolving
      - dissolved
      type: string
      description: |-
        * `pending` - En attente du partenaire
        * `active` - Actif
        * `dissolving` - En dissolution
        * `dissolved` - Dissous
    CreateCoupleRequest:
      type: object
      properties:
        start_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          minLength: 1
          default: EUR
          maxLength: 3
    DeviceRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(Exponent|Expo)PushToken\[[^\]]+\]$
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    DirectionEnum:
      enum:
      - partner_owes_me
      - i_owe_partner
      - settled
      type: string
      description: |-
        * `partner_owes_me` - partner_owes_me
        * `i_owe_partner` - i_owe_partner
        * `settled` - settled
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ErrorCode:
      type: object
      description: Business error with a stable machine code, translated by the app.
      properties:
        code:
          type: string
      required:
      - code
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        place:
          type: string
          maxLength: 200
        all_day:
          type: boolean
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        recurrence:
          $ref: '#/components/schemas/RecurrenceEnum'
        concerns:
          $ref: '#/components/schemas/RelativePersonEnum'
        reminder_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
      - updated_at
    EventKindEnum:
      enum:
      - event
      - birthday
      - reunion
      type: string
      description: |-
        * `event` - Événement
        * `birthday` - Anniversaire
        * `reunion` - Retrouvailles
    EventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        place:
          type: string
          maxLength: 200
        all_day:
          type: boolean
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        recurrence:
          $ref: '#/components/schemas/RecurrenceEnum'
        concerns:
          $ref: '#/components/schemas/RelativePersonEnum'
        reminder_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
      required:
      - title
    Expense:
      type: object
      description: Amounts in the currency's smallest unit (cents). Shares are relative
        to the reader.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        amount:
          type: integer
          maximum: 100000000
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        category:
          $ref: '#/components/schemas/ExpenseCategoryEnum'
        spent_on:
          type: string
          format: date
        paid_by:
          $ref: '#/components/schemas/PayerEnum'
        split:
          $ref: '#/components/schemas/SplitEnum'
        my_share:
          type: integer
          maximum: 100000000
          minimum: 0
        partner_share:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - partner_share
      - title
    ExpenseCategoryEnum:
      enum:
      - groceries
      - home
      - outings
      - travel
      - gifts
      - health
      - other
      type: string
      description: |-
        * `groceries` - Courses
        * `home` - Maison
        * `outings` - Sorties
        * `travel` - Voyages
        * `gifts` - Cadeaux
        * `health` - Santé
        * `other` - Autre
    ExpenseRequest:
      type: object
      description: Amounts in the currency's smallest unit (cents). Shares are relative
        to the reader.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        amount:
          type: integer
          maximum: 100000000
          minimum: 1
        currency:
          type: string
          minLength: 1
          pattern: ^[A-Z]{3}$
        category:
          $ref: '#/components/schemas/ExpenseCategoryEnum'
        spent_on:
          type: string
          format: date
        paid_by:
          $ref: '#/components/schemas/PayerEnum'
        split:
          $ref: '#/components/schemas/SplitEnum'
        my_share:
          type: integer
          maximum: 100000000
          minimum: 0
      required:
      - amount
      - title
    Health:
      type: object
      properties:
        status:
          type: string
        brand:
          type: string
      required:
      - brand
      - status
    Heart:
      type: object
      properties:
        my_heart:
          type: boolean
      required:
      - my_heart
    ImageKeyRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - key
    ImageUploadRequestRequest:
      type: object
      properties:
        content_type:
          type: string
          minLength: 1
      required:
      - content_type
    ImageUploadTicket:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        form_fields:
          type: object
          additionalProperties:
            type: string
        max_bytes:
          type: integer
        expires_in:
          type: integer
      required:
      - expires_in
      - form_fields
      - key
      - max_bytes
      - url
    ImageUrl:
      type: object
      properties:
        url:
          type: string
          nullable: true
      required:
      - url
    JoinCoupleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - code
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    ListItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 200
        done:
          type: boolean
        done_by:
          type: string
          nullable: true
          description: '`me` / `you`: who ticked it, relative to the reader (no tally
            is ever kept).'
          readOnly: true
        done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        position:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - done_at
      - done_by
      - id
      - position
      - text
    ListItemRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
      required:
      - text
    ListKindEnum:
      enum:
      - groceries
      - free
      type: string
      description: |-
        * `groceries` - Courses
        * `free` - Libre
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MediaUploadRequestRequest:
      type: object
      properties:
        content_type:
          type: string
          minLength: 1
      required:
      - content_type
    Member:
      type: object
